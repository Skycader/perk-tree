<!doctype html>

    <meta charset="UTF-8" />
    <!-- Applies the saved UI zoom (js/zoom.js) before any CSS/content loads, so
         the page never flashes at 100% and then jumps to the saved level.
         Plain synchronous script, not a module — needs to run before the
         very first paint, no import overhead to wait on. Scales the root
         font-size (every font-size in this codebase is `rem`, relative to
         this — see base.css), not `zoom` — zoom scales the whole rendered
         page and desyncs from this app's JS-computed tooltip/connector
         pixel positions, which font-only scaling never touches. -->
    <script>
      (function () {
        var v = localStorage.getItem('uiZoomPercent');
        var n = v === null ? 100 : parseInt(v, 10);
        if (!isFinite(n)) n = 100;
        n = Math.min(200, Math.max(50, n));
        document.documentElement.style.fontSize = (16 * n) / 100 + 'px';
      })();
    </script>
    <meta name="viewport" id="viewport-meta" content="width=1920, user-scalable=yes, initial-scale=0.3" />
    <!-- MOBILE_ADAPT toggle — mirrors js/constants.js's MOBILE_ADAPT (see the
         comment there for why this can't just import it). Runs synchronously
         before any CSS/content, same reasoning as the zoom-restore script
         below: picks the viewport meta and adds html.mobile-adapt (which
         css/mobile.css's rules all require) before first paint, so there's
         no flash of the wrong layout while an ES module would still be
         loading. When false, the viewport meta above (forced 1920 desktop
         layout) is simply left as-is and html.mobile-adapt is never added,
         so css/mobile.css's rules never fire regardless of screen width. -->
    <script>
      (function () {
        var MOBILE_ADAPT = false;
        if (MOBILE_ADAPT) {
          document
            .getElementById('viewport-meta')
            .setAttribute('content', 'width=device-width, initial-scale=1');
          document.documentElement.classList.add('mobile-adapt');
        }
      })();
    </script>

    <!-- STARTUP NOTE — random tip from notes.js. Populated early (while
         #page-loader is still up) by the inline script below, already
         parked at its final bottom-anchored resting spot (see notes.css) so
         it never moves; js/notes-popup.js later adopts it (arrows/close/
         timer) — see settleNotesPopup(). -->
    <div id="notes-popup">
      <div class="notes-title-box">

        </div>
      </div>
      <div class="notes-content" id="notes-content"></div>
      <label class="notes-startup-row" id="notes-startup-row">
        <input type="checkbox" id="notes-startup-checkbox" />
        Показывать заметки при запуске

      <div class="notes-timer-track" id="notes-timer-track">
        <div class="notes-timer-fill" id="notes-timer-fill"></div>
      </div>
    </div>
    <!-- `async` + placed ahead of js/main.js on purpose: on a slow connection the
         full app module graph (tooltip.js, tree.js, config.js, …) can take a
         while to arrive, but this only needs the small notes.js file, so the
         note shows up long before the spinner would otherwise hide. Renders
         inline with `marked` (already loaded as a classic script above)
         instead of importing markdown.js, which would drag in config.js
         just for this one lightweight use. -->
    <script type="module" async>
      import { notes } from './notes.js';
      import { NOTES } from './js/constants.js';
      const STORAGE_KEY = 'showNotesOnStartup';
      const showOnStartup =
        localStorage.getItem(STORAGE_KEY) !== 'false'; /* null (unset) → true */
      if (notes.length && showOnStartup) {
        const idx = Math.floor(Math.random() * notes.length);
        const note = notes[idx];
        const md = (s) =>
          (typeof marked !== 'undefined' ? marked.parseInline(s) : s).replace(
            /==([^=\n]+?)==/g,
            '<mark>$1</mark>',
          );
        document.getElementById('notes-title').textContent = note.title || '';
        // author is just the last line of the content area (see
        // .note-author-line in notes.css) — not a separate footer element.
        const authorLine = note.author
          ? '<div class="note-author-line">' + md(note.author) + '</div>'
          : '';
        document.getElementById('notes-content').innerHTML =
          md(note.content || '') + authorLine;
        const popupEl = document.getElementById('notes-popup');
        // Wait for notes.css itself before measuring/positioning below.
        // This script is `async`, so — unlike a normal parser-blocking
        // script — it can execute before the stylesheet has finished
        // loading, measuring an unstyled (wrong-width, wrong-wrapping) box
        // and baking that wrong height into the one-time `top` calc, which
        // then visibly jumps once notes-popup.js re-measures the properly
        // styled box later.
        const cssLink = document.getElementById('notes-css');
        if (cssLink && !cssLink.sheet) {
          await new Promise((resolve) =>
            cssLink.addEventListener('load', resolve, { once: true }),
          );
        }
        // Layout CSS alone isn't enough — text still wraps against a
        // fallback font's metrics until the actual JetBrains Mono webfont
        // finishes downloading (a separate, slower fetch than the
        // stylesheet itself), which can reflow the content to a different
        // line count/height. main.js already waits on this same signal
        // before measuring the tree for the same reason.
        await document.fonts.ready;
        popupEl.classList.add('visible');
        // Always bottom-anchored — no spinner-adjacent parking spot or
        // descend-into-place animation, the popup simply lives at its
        // resting position from the very first frame, sized to THIS note's
        // real height. Same math as applyRestPosition() in notes-popup.js
        // (including the "only cap max-height when actually needed"
        // rounding-safety note there), duplicated here since that module
        // isn't imported this early (see the note above on why).
        const naturalHeight = popupEl.offsetHeight;
        const available = window.innerHeight - NOTES.bottomGap - NOTES.topGap;
        if (naturalHeight > available) {
          popupEl.style.top = NOTES.topGap + 'px';
          popupEl.style.maxHeight = available + 'px';
        } else {
          popupEl.style.top =
            window.innerHeight - NOTES.bottomGap - naturalHeight + 'px';
        }
        window.__earlyNoteShown = true;
        window.__earlyNoteIdx = idx;
      }
    </script>
