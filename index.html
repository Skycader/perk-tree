<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- force desktop layout (1920x1080-class) on all devices, including phones.
         Mobile users are expected to pinch-zoom the whole page natively
         instead of getting a squeezed "responsive" layout. -->
    <meta
      name="viewport"
      content="width=1920, user-scalable=yes, initial-scale=0.3"
    />
    <title>Древо</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23e09040' stroke-width='2.5'/><circle cx='16' cy='16' r='3' fill='%23e09040'/><line x1='16' y1='4' x2='16' y2='28' stroke='%23e09040' stroke-width='1.5'/><line x1='4' y1='16' x2='28' y2='16' stroke='%23e09040' stroke-width='1.5'/></svg>"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3C%21--%20nucleus%20--%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%224%22%20fill%3D%22%23e09040%22/%3E%0A%20%20%3C%21--%20orbit%20ellipse%20rotated%20-35deg%20--%3E%0A%20%20%3Cellipse%20cx%3D%2216%22%20cy%3D%2216%22%20rx%3D%2213%22%20ry%3D%225.5%22%0A%20%20%20%20fill%3D%22none%22%20stroke%3D%22%23c87830%22%20stroke-width%3D%221%22%0A%20%20%20%20transform%3D%22rotate%28-35%2016%2016%29%22/%3E%0A%20%20%3C%21--%20electron%3A%20position%20on%20orbit%20at%20~-35deg%20angle%20%3D%20top-right%20--%3E%0A%20%20%3C%21--%20at%20angle%200%20on%20ellipse%3A%20%2816%2B13%2C%2016%29%20%3D%20%2829%2C16%29%2C%20rotate%20point%20by%20-35deg%20around%20%2816%2C16%29%20--%3E%0A%20%20%3C%21--%20cos%28-35%29%3D0.819%2C%20sin%28-35%29%3D-0.574%20--%3E%0A%20%20%3C%21--%20x%20%3D%2016%20%2B%2013%2A0.819%20%3D%2026.65%2C%20y%20%3D%2016%20%2B%205.5%2A%28-0.574%29%20%3D%2012.84%20--%3E%0A%20%20%3C%21--%20but%20we%20want%20electron%20at%20~-60deg%20on%20ellipse%20for%20top-right%20feel%20--%3E%0A%20%20%3C%21--%20angle%3D-60%3A%20x%3D16%2B13%2Acos%28-60%29%3D16%2B6.5%3D22.5%2C%20y%3D16%2B5.5%2Asin%28-60%29%3D16-4.76%3D11.24%2C%20then%20rotate%20-35%20--%3E%0A%20%20%3C%21--%20easier%3A%20just%20place%20it%20visually%20--%3E%0A%20%20%3Ccircle%20cx%3D%2224.5%22%20cy%3D%229.5%22%20r%3D%222.5%22%20fill%3D%22%23e09040%22/%3E%0A%3C/svg%3E"
    />
    <script src="libs/marked.min.js"></script>
    <link href="libs/css2.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/tree.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/tooltip.css" />
    <link rel="stylesheet" href="css/windows.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="css/license.css" />
    <link rel="stylesheet" href="css/notes.css" />
  </head>
  <body>
    <!-- global page-loading spinner: hidden by the inline script once init finishes -->
    <div id="page-loader">
      <svg class="page-loader-svg" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="18"></circle>
      </svg>
    </div>

    <div class="topbar">
      <div class="tb-left">
        <span class="tb-title" id="tb-title"
          ><span
            style="
              display: inline-block;
              width: 10px;
              height: 10px;
              background: #e09040;
              border-radius: 1px;
              margin-right: 8px;
              vertical-align: middle;
            "
          ></span
          >ДРЕВО</span
        ><span class="tb-sub">Матрица способностей</span>
      </div>
      <div class="tb-stats">
        <span class="tb-stat">Перков: <span id="stat-perks">—</span></span>
        <span class="tb-stat"
          >Уровней на ранг: <span id="stat-lvl-per-rank">—</span></span
        >
        <span class="tb-stat"
          >Макс. уровень: <span id="stat-max-lvl">—</span></span
        >
      </div>
      <div class="tb-right">
        <span id="exp-st"></span>
        <span class="tb-app-version" title="Версия программы">0.9</span>
        <button class="btn" onclick="exportPNG()">⬇ PNG</button>
        <button
          class="btn"
          id="license-toolbar"
          title="Лицензия"
          style="padding: 5px 9px"
        >
          <svg
            viewBox="0 0 16 16"
            width="13"
            height="13"
            style="vertical-align: middle"
          >
            <rect
              x="2.5"
              y="1.5"
              width="9"
              height="13"
              rx="1"
              fill="none"
              stroke="#e09040"
              stroke-width="1.1"
            />
            <path d="M9 1.5 L13.5 6 L9 6 Z" fill="#e09040" opacity="0.5" />
            <line
              x1="4.3"
              y1="8"
              x2="9.5"
              y2="8"
              stroke="#e09040"
              stroke-width="0.9"
            />
            <line
              x1="4.3"
              y1="10"
              x2="9.5"
              y2="10"
              stroke="#e09040"
              stroke-width="0.9"
            />
            <line
              x1="4.3"
              y1="12"
              x2="7.5"
              y2="12"
              stroke="#e09040"
              stroke-width="0.9"
            />
          </svg>
        </button>
      </div>
    </div>

    <div id="export-root">
      <div class="page">
        <div class="main-area" id="main-area">
          <div class="meta-row">
            <div class="title-box" id="title-box">
              <div class="title-box-name" id="title-name">
                <span
                  style="
                    display: inline-block;
                    width: 10px;
                    height: 10px;
                    background: #e09040;
                    border-radius: 1px;
                    margin-right: 7px;
                    vertical-align: middle;
                  "
                ></span
                >—
              </div>
              <div class="title-box-sub" id="title-desc">—</div>
              <div class="title-box-version" id="title-version"></div>
            </div>
            <div class="altnames-box" id="altnames-box"></div>
          </div>
          <div style="height: 40px" id="bus-spacer"></div>
          <div class="cols-row" id="cols-row"></div>
        </div>
        <div class="sidebar" id="sidebar"></div>
      </div>
      <div class="bottom-bar" id="bottom-bar"></div>
    </div>

    <canvas
      id="bg-canvas"
      style="
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      "
    ></canvas>
    <div id="tt-overlay"></div>
    <div id="sp-overlay"></div>

    <div class="tooltip" id="sp-tooltip">
      <div class="tt-header">
        <span id="sp-header"></span>
        <button class="tt-close" onclick="hideSpectre()" title="Закрыть">
          ✕
        </button>
      </div>
      <div class="tt-levels" id="sp-levels"></div>
    </div>
    <!-- tooltip arrow -->
    <svg id="tt-arrow-svg" style="display: none"></svg>
    <svg
      id="lvl-sq-arrow-svg"
      style="
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: none;
        z-index: 600;
        overflow: visible;
      "
    ></svg>

    <!-- tooltip -->
    <div class="tooltip" id="tooltip">
      <div class="tt-header">
        <span id="tt-header"></span>
        <button class="tt-close" onclick="hideTooltip()" title="Закрыть">
          ✕
        </button>
      </div>
      <div class="tt-levels" id="tt-levels"></div>
      <div class="tt-lvl-nav" id="tt-lvl-nav">
        <div class="tt-lvl-nav-popup" id="tt-lvl-nav-popup"></div>
        <button
          class="tt-lvl-nav-btn"
          id="tt-lvl-nav-btn"
          title="Перейти к уровню"
        >
          <svg viewBox="0 0 14 14" width="12" height="12">
            <line
              x1="2"
              y1="4"
              x2="12"
              y2="4"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
            <line
              x1="2"
              y1="7"
              x2="12"
              y2="7"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
            <line
              x1="2"
              y1="10"
              x2="8"
              y2="10"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- LICENSE / docs modal — tabs and content are generated from the MODAL constant -->
    <div id="license-overlay"></div>
    <div id="license-modal">
      <div class="tt-header">
        <span>📄 Документация</span>
        <button class="tt-close" onclick="hideLicense()" title="Закрыть">
          ✕
        </button>
      </div>
      <div id="license-tabs"></div>
      <div id="license-panes"></div>
      <div id="license-footer">
        <a id="license-download" download>⬇ Скачать</a>
      </div>
    </div>

    <!-- STARTUP NOTE — random tip from notes.js, shown once the tree has loaded -->
    <div id="notes-popup">
      <div class="notes-title-box">
        <span id="notes-title"></span>
        <div class="notes-header-actions">
          <button class="notes-nav notes-nav-prev" id="notes-prev" title="Предыдущая">
            ‹
          </button>
          <button class="notes-nav notes-nav-next" id="notes-next" title="Следующая">
            ›
          </button>
          <button class="notes-close" id="notes-close" title="Закрыть">✕</button>
        </div>
      </div>
      <div class="notes-content" id="notes-content"></div>
      <div class="notes-footer-author"><span id="notes-author"></span></div>
      <label class="notes-startup-row" id="notes-startup-row">
        <input type="checkbox" id="notes-startup-checkbox" />
        Показывать заметки при запуске
      </label>
      <div class="notes-timer-track" id="notes-timer-track">
        <div class="notes-timer-fill" id="notes-timer-fill"></div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <div id="audio-vol-popup">
      <div class="audio-vol-track">
        <div class="audio-vol-fill"></div>
        <div class="audio-vol-thumb"></div>
      </div>
    </div>
  </body>
</html>
