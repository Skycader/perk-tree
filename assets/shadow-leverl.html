<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    background: #0d0e18; color: #c0bdb4;
  }
  button {
    font-family: inherit; font-size: 13px; cursor: pointer;
    background: #1a1d2e; color: #e09040; border: 1px solid #2a3050;
    border-radius: 3px; padding: 6px 14px;
  }
  button:hover { border-color: #e09040; }
</style>
</head>
<body>
  <div>Placeholder — заменить содержимым на assets/shadow-leverl.html</div>
  <button id="b">clicks: 0</button>
  <script>
    let n = 0;
    document.getElementById('b').addEventListener('click', () => {
      n++;
      document.getElementById('b').textContent = 'clicks: ' + n;
    });
  </script>
</body>
</html>
